seed: 20260729

dataset:
  dataset_version: v1.0
  manifest_path: metadata/dataset_v1/dataset_manifest.csv
  dataset_config_path: metadata/dataset_v1/freeze/dataset_config.json
  normalization_path: metadata/dataset_v1/normalization/training_normalization.json
  train_split: train
  val_split: val
  test_split: test
  tile_size: 256
  input_channels: 2
  num_classes: 5
  ignore_index: 255
  class_names:
    - buildings
    - roads
    - vegetation
    - bare_land
    - water
  exclude_zero_valid: true

model:
  name: deeplabv3plus
  input_channels: 2
  num_classes: 5
  backbone: resnet18
  encoder_base_channels: 64
  output_stride: 16
  aspp_channels: 256
  low_level_channels: 48
  decoder_channels: 256
  atrous_rates: [6, 12, 18]
  dropout: 0.1
  normalization: groupnorm
  group_norm_groups: 32

loss:
  name: ce_dice
  cross_entropy_weight: 0.5
  dice_weight: 0.5
  dice_smoothing: 1.0
  class_weights_file: metadata/dataset_v1/statistics/class_weights_candidates.csv
  class_weight_strategy: effective_number
  include_absent_classes: false

optimizer:
  name: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  epsilon: 1.0e-08

scheduler:
  name: reduce_on_plateau
  monitor: val_mean_iou
  mode: max
  factor: 0.5
  patience: 2
  minimum_learning_rate: 1.0e-06

data:
  batch_size: 4
  num_workers: 0
  pin_memory: false

augmentation:
  enabled: true
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotate_90_probability: 0.5
  enable_sar_intensity: false
  enable_speckle: false

training:
  max_epochs: 5
  device: auto
  mixed_precision: true
  gradient_clip_norm: 1.0
  accumulation_steps: 1
  monitor: mean_iou
  monitor_mode: max
  early_stopping:
    patience: 5
    minimum_delta: 0.0
  checkpoint:
    save_every_epochs: 1
  logging:
    tensorboard: false
    progress_bar: true

experiment:
  name: deeplabv3plus_resnet18_gn_v1_weighted_pilot
  output_directory: outputs/model_experiments/deeplabv3plus_resnet18_gn_v1_weighted_pilot

benchmark:
  enabled: true
  warmup_batches: 3
  measured_batches: 20
