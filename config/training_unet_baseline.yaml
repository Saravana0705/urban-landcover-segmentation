# Baseline U-Net pilot configuration for Dataset V1.
#
# Run the 3-epoch pilot first:
# python -m src.training.train_unet --config config/training_unet_baseline.yaml
#
# After reviewing loss, mIoU, runtime, and memory usage, increase
# training.max_epochs for the full baseline experiment.

seed: 20260725

dataset:
  dataset_version: v1.0
  manifest_path: metadata/dataset_v1/dataset_manifest.csv
  dataset_config_path: metadata/dataset_v1/freeze/dataset_config.json
  normalization_path: metadata/dataset_v1/normalization/training_normalization.json
  train_split: train
  val_split: val
  test_split: test
  tile_size: 256
  input_channels: 2
  num_classes: 5
  ignore_index: 255
  class_names:
    - buildings
    - roads
    - vegetation
    - bare_land
    - water
  exclude_zero_valid: true

model:
  name: unet
  input_channels: 2
  num_classes: 5
  base_channels: 32
  dropout: 0.1
  use_batch_norm: true

loss:
  name: ce_dice
  cross_entropy_weight: 0.5
  dice_weight: 0.5
  dice_smoothing: 1.0
  class_weights_file: metadata/dataset_v1/statistics/class_weights_candidates.csv
  class_weight_strategy: effective_number
  include_absent_classes: false

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  betas:
    - 0.9
    - 0.999
  epsilon: 1.0e-08

scheduler:
  name: reduce_on_plateau
  monitor: val_mean_iou
  mode: max
  factor: 0.5
  patience: 2
  minimum_learning_rate: 1.0e-06

data:
  batch_size: 4
  num_workers: 0
  pin_memory: false

augmentation:
  enabled: true
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotate_90_probability: 0.5

  # Keep SAR-specific perturbations disabled for the baseline.
  enable_sar_intensity: false
  enable_speckle: false

training:
  max_epochs: 3
  device: auto
  mixed_precision: true
  gradient_clip_norm: 1.0
  accumulation_steps: 1

  monitor: mean_iou
  monitor_mode: max

  early_stopping:
    patience: 3
    minimum_delta: 0.0

  checkpoint:
    save_every_epochs: 1

  logging:
    tensorboard: false
    progress_bar: true

experiment:
  name: unet_baseline_v1_pilot
  output_directory: outputs/model_experiments/unet_baseline_v1_pilot
