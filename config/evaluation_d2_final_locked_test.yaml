safety:
  selection_locked_before_test: true
  explicit_test_authorization_required: true
  additional_validation_search_permitted: false
  additional_training_permitted: false
  checkpoint_updates_permitted: false
  test_result_may_trigger_reselection: false
  refuse_existing_output_directory: true
  interpretation_policy: >-
    The single test result estimates final generalization only. It must not
    trigger checkpoint, threshold, TTA, multiplier, architecture or dataset
    reselection.
