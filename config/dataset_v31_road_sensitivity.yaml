schema_version: dataset-v3.1-road-sensitivity-0.1

ignore_index: 255
tile_size: 256

coverage_gate:
  minimum_valid_fraction_source_pixels: 0.40
  maximum_padding_fraction: 0.25

stable_bare_land:
  retain_urban_atlas_codes:
    - 13100
    - 33000

road_policies:
  priority_classes_min_2m:
    minimum_width_m: 2.0
    allowed_highway_classes: &priority_classes
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link
      - tertiary
      - tertiary_link
      - residential
      - unclassified

  priority_classes_min_6m:
    minimum_width_m: 6.0
    allowed_highway_classes: *priority_classes

  priority_classes_min_8m:
    minimum_width_m: 8.0
    allowed_highway_classes: *priority_classes

  priority_classes_min_10m:
    minimum_width_m: 10.0
    allowed_highway_classes: *priority_classes

  major_classes_min_2m:
    minimum_width_m: 2.0
    allowed_highway_classes:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link

simulation_variants:
  - name: v3_control
    road_policy: none
    stable_bare: false
  - name: v31_priority_classes_min_2m
    road_policy: priority_classes_min_2m
    stable_bare: false
  - name: v31_priority_classes_min_6m
    road_policy: priority_classes_min_6m
    stable_bare: false
  - name: v31_priority_classes_min_8m
    road_policy: priority_classes_min_8m
    stable_bare: false
  - name: v31_priority_classes_min_10m
    road_policy: priority_classes_min_10m
    stable_bare: false
  - name: v31_major_classes_min_2m
    road_policy: major_classes_min_2m
    stable_bare: false
  - name: v31_stable_bare_only
    road_policy: none
    stable_bare: true

