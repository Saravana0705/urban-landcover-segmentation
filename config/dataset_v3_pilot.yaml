dataset:
  version: "v3-pilot-0.2"
  status: "two_city_fusion_pilot"
  preserve_existing_versions:
    - "v1"
    - "v2.1"
    - "v2.2"

dynamic_world:
  collection: "GOOGLE/DYNAMICWORLD/V1"
  temporal_window_days: 30
  insufficient_observation_threshold: 3
  fallback_temporal_window_days: 45
  drive_folder: "urban_landcover_v3_pilot"
  probability_classes:
    - water
    - trees
    - grass
    - flooded_vegetation
    - crops
    - shrub_and_scrub
    - built
    - bare
    - snow_and_ice

outputs:
  raw_root: "data/raw/labels_v3/dynamic_world"
  report_root: "metadata/dataset_v3/pilot/dynamic_world"
  fused_root: "data/interim/labels_v3/fused_pilot"
  fused_report_root: "metadata/dataset_v3/pilot/fusion"

fusion:
  ignore_index: 255
  class_ids: {buildings: 1, roads: 2, vegetation: 3, bare_land: 4, water: 5}
  precedence: [buildings, roads, water, bare_land, vegetation]
  buildings: {rule: "osm_primary"}
  roads: {rule: "osm_primary"}
  vegetation: {rule: "at_least_two_of_osm_dynamic_world_urban_atlas"}
  water: {rule: "at_least_two_of_osm_dynamic_world_urban_atlas"}
  bare_land:
    rule: "osm_and_urban_atlas_code"
    accepted_urban_atlas_codes: [13100, 13300, 33000]
    explicitly_ignored_urban_atlas_codes: [13400]
  dynamic_world_confidence:
    modal_mean_argmax_consensus: true
    assigned_probability_min: 0.60
    temporal_agreement_min: 0.70
    observation_count_min: 5

