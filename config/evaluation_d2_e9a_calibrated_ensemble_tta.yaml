experiment:
  name: d2_e9a_calibrated_ensemble_tta
selection_split: val
batch_size: 2
num_workers: 0
seed: 20260725

# The search reads only validation caches. Test caching/evaluation additionally
# requires the explicit --authorize-test command-line flag after this is locked.
tta_transforms:
  - identity
  - horizontal_flip
  - vertical_flip
  - rotate_180

members:
  - name: unetpp_d2
    training_config: config/training_unetpp_v3_mt_d2_s0_cross_orbit_50ep.yaml
    checkpoint: outputs/model_experiments/unetpp_v3_mt_d2_s0_cross_orbit_50ep/checkpoints/best.pt
  - name: unetpp_e7_uncertainty
    training_config: config/training_unetpp_v3_mt_d2_e7_uncertainty_labels_50ep.yaml
    checkpoint: outputs/model_experiments/unetpp_v3_mt_d2_e7_uncertainty_labels_50ep/checkpoints/best.pt
  - name: orbit_aware_unet_d2
    training_config: config/training_orbit_aware_unet_v3_mt_d2_e2_50ep.yaml
    checkpoint: outputs/model_experiments/orbit_aware_unet_v3_mt_d2_e2_50ep/checkpoints/best.pt
  - name: unet_d2_ratio
    training_config: config/training_unet_v3_mt_d2_f1_cross_orbit_ratio_50ep.yaml
    checkpoint: outputs/model_experiments/unet_v3_mt_d2_f1_cross_orbit_ratio_50ep/checkpoints/best.pt

search:
  # Member order is exactly the order above. The first candidate reproduces
  # E6A while assigning zero weight to the newly available E7 member.
  weight_candidates:
    - [0.50, 0.00, 0.25, 0.25]
    - [0.60, 0.00, 0.20, 0.20]
    - [0.70, 0.00, 0.15, 0.15]
    - [0.50, 0.10, 0.20, 0.20]
    - [0.45, 0.15, 0.20, 0.20]
    - [0.50, 0.15, 0.20, 0.15]
    - [0.55, 0.15, 0.15, 0.15]
    - [0.60, 0.15, 0.15, 0.10]
    - [0.70, 0.20, 0.05, 0.05]
    - [0.75, 0.25, 0.00, 0.00]
  coordinate_passes: 2
  class_multiplier_candidates:
    buildings: [0.95, 1.00, 1.05, 1.10]
    roads: [1.00, 1.05, 1.10, 1.15, 1.20, 1.30]
    vegetation: [0.95, 1.00, 1.05]
    bare_land: [0.90, 0.95, 1.00, 1.05, 1.10, 1.15, 1.20]
    water: [0.95, 1.00, 1.05]

cache_directory: outputs/model_experiments/d2_e9a_calibrated_ensemble_tta/cache
output_directory: outputs/model_experiments/d2_e9a_calibrated_ensemble_tta/reports
